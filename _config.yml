### Site Settings ###
title               : Sam Hutchings
description         : >-                               # >- means to ignore newlines until "url:"
                      Designer and Artist. Currently working at The Familiar.
url                 : "https://samhutchings.co"                               # base hostname & protocol for your site (e.g. http://example.com)
baseurl             : ""                    # subpath of your site (e.g. /blog) [IMPORTANT: use "" if your are hosting at https://username.github.io directly]
repository          : "Smutchings/smutchings.github.io"    # repository metadata on GitHub Pages [know more at https://help.github.com/en/articles/repository-metadata-on-github-pages]
### remote_theme        : YoussefRaafatNasry/portfolYOU    # uncomment this if you are using it as a remote theme

### Author Info ###
author:
  name              : Sam Hutchings
  image             : /img/homeHero.png
  dribbble          : Smutchings
  email             : hi@samhutchings.co
  github            : smutchings
  instagram         : smutchings
  linkedin          : smutchings
  medium            : smutchings
  twitter           : smutchings


### Pagination ###
paginate: 6
paginate_path: "/articles/page-:num/"


### Posts Permalink ###
permalink: articles/:title


### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name

  art:
    output: true
    permalink: /art/:name


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"


### Exclude from processing ###
exclude:
- README.md
- CONTRIBUTING.md
- LICENSE
- Gemfile
- Gemfile.lock

### Plugins
plugins:
  - jemoji
  - jekyll-paginate